# Gitleaks ran on stock rules only, which is a reasonable default and misses the
# two secret shapes this repo is actually built around. Neither is in gitleaks'
# upstream ruleset, because neither is a widely-known token format: one is age's
# private key, the other is Proton Pass's personal access token.
#
# These are the two credentials whose loss or exposure is unrecoverable in the
# specific way this repo cares about — the age key cannot be re-issued at all,
# and the Proton PAT is the single thing that reaches every other secret. If
# either ever lands in a commit, stock rules would have said nothing.
#
# Read by `mise run secrets` and by the gitleaks CI job, both of which pick up
# this file from the repo root without being told to.

[extend]
useDefault = true

[[rules]]
id = "age-secret-key"
description = "age private key"
# Bech32 body, always uppercase in age's own output, always exactly this length.
# Anchored on the full shape rather than the prefix so the fixtures that use
# AGE-SECRET-KEY-FAKE and AGE-SECRET-KEY-SENTINEL-PLAINTEXT to prove a secret
# did *not* leak are not themselves reported as leaks.
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{58}'''
keywords = ["AGE-SECRET-KEY-1"]

[[rules]]
id = "age-armoured-ciphertext"
description = "age passphrase-encrypted file"
# Not a secret shape — that is the point. This is what `dotfiles-secrets-export`
# writes: the unreissuable age key, encrypted under a passphrase. It is exactly
# the thing you are supposed to keep, and exactly the thing that must never be
# committed, because published ciphertext is offline-crackable forever while a
# passphrase is only as good as the day it was chosen.
#
# The export refuses a destination inside a git work tree, which is the real
# defence. This is the second one, for a copy that arrived some other way — a
# file manager, a stray `cp`, a merge from a branch that predates the guard.
#
# The armour header is fixed text emitted by `age -a`, so there is nothing to
# tune and no false-positive surface beyond a file that genuinely contains one.
regex = '''-----BEGIN AGE ENCRYPTED FILE-----'''
keywords = ["BEGIN AGE ENCRYPTED FILE"]

# Two kinds of exception, and only two.
#
# First, files whose job is to contain this string: the bats fixture proving the
# export writes ciphertext rather than plaintext, and the prose that explains
# why none of this is done that way any more.
#
# Second — and this is the uncomfortable one — the repo's own history. Before
# the move to Proton Pass this repo really did carry `chezmoi --encrypt` blobs,
# and they are still in the history of a public repository: the sops age key,
# the gh token, the ssh signing key, the DevPod env, the sugarrush config. They
# are listed here by their exact historical paths, every one of which is a file
# that no longer exists and cannot come back. That is what makes the allowlist
# safe: it exempts named history, not a pattern that a future mistake could
# match.
#
# The `home/` prefix is optional in each pattern because `.chezmoiroot` moved
# the whole tree, so every one of these paths exists in history twice — once
# before the move and once after. Only the pre-move spellings were listed at
# first, and it passed anyway: `gitleaks git` reads diffs, and the move was
# recorded as a pure rename with no content to scan. That is luck, not a
# design, and it would evaporate the moment anything scanned trees instead.
[rules.allowlist]
paths = [
  '''tests/secrets-export\.bats''',
  '''CLAUDE\.md''',
  '''docs/superpowers/.*\.md''',
  '''^(home/)?dot_config/.*\.age$''',
  '''^(home/)?private_dot_ssh/.*\.age$''',
  '''^(home/)?key\.txt\.age$''',
]

[[rules]]
id = "proton-pass-pat"
description = "Proton Pass personal access token"
# `pst_` prefix, as shown in the README's bootstrap example. The length floor
# keeps the README's own `pst_…` placeholder from matching, since a rule that
# fires on the documentation is a rule someone turns off.
regex = '''pst_[A-Za-z0-9_-]{24,}'''
keywords = ["pst_"]
