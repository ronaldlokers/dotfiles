# Tooling for working ON this repo, not for the machines it configures — those
# tools live in dot_config/mise/config.toml. Pinned so a local `mise run lint`
# and the CI job run byte-identical versions; CI installs from this same file.
#
# Repo-only, so it's listed in .chezmoiignore and never applied into $HOME.

[tools]
shellcheck = "0.11.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
bats = "1.14.0"
# The suite renders a script template, so the tests need chezmoi itself. Kept at
# the same version as the machines install; the lint task below asserts all
# three copies of this number agree.
chezmoi = "2.70.5"
# renovate stays an `npx --yes` call rather than a mise tool: it is run by this
# one lint line only.

[tasks.lint]
description = "shellcheck the scripts and validate the JSON/Renovate config"
run = [
	"shellcheck --severity=warning setup home/.chezmoiscripts/*.sh.tmpl home/.chezmoiscripts/run_after_12-ensure-ssh-include.sh home/dot_claude/executable_statusline.sh home/dot_claude/modify_settings.json home/dot_config/shell/ssh-agent.sh home/dot_config/shell/github-token.sh home/dot_local/share/exact_devcontainer-template/post-create.sh home/dot_local/bin/executable_devcontainer-init home/dot_local/bin/executable_devpod home/dot_local/bin/executable_proton-ssh-load tests/helpers.bash",
	# The workflows lint themselves: a typo in a job key or a bad `needs:`
	# reference otherwise only shows up as a skipped job on a green PR.
	"actionlint",
	# modify_settings.json's own behaviour — valid JSON out, the no-jq fallback,
	# the fixed-point property — is covered by tests/modify-settings.bats. Two
	# unreadable one-liners used to live here instead.
	# renovate: datasource=npm depName=renovate
	"npx --yes --package renovate@43.285.0 renovate-config-validator .github/renovate.json",
	# Three files now carry a chezmoi version: the .chezmoiversion floor, the
	# mise pin every machine installs, and this repo's own pin (the tests render
	# a script template, so they need the binary). Renovate bumps the pins; this
	# is what says "bump the floor too". A multi-line literal ('''), because the
	# sed script needs single quotes and a double-quoted TOML string would need
	# every " and \ escaped.
	'''v="$(cat .chezmoiversion)"; p="$(sed -n 's/^chezmoi = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)"; r="$(sed -n 's/^chezmoi = "\(.*\)"$/\1/p' mise.toml)"; { [ "$v" = "$p" ] && [ "$v" = "$r" ]; } || { echo ".chezmoiversion ($v), the machine pin ($p) and this repo's pin ($r) disagree" >&2; exit 1; }''',
]

[tasks.test]
description = "run the bats suite against the scripts"
# These cover the branches a clean-HOME apply never reaches. `verify` proves an
# apply succeeds on an empty machine; it says nothing about what the ssh-include
# script does to a config that already has a Host block in it, or what the
# statusline prints when the context percentage arrives as a bare fraction.
run = "bats --print-output-on-failure tests/"

[tasks.secrets]
description = "scan the full history for committed secrets, as CI does"
run = "gitleaks git --no-banner ."

[tasks.verify]
description = "bootstrap into a throwaway HOME the way CI does"
# </dev/null is the point of the exercise, not an afterthought: it's what makes
# this reproduce `devpod up` and CI, where scripts have no TTY to prompt on. A
# run that inherits a terminal silently exercises a different code path.
run = '''
set -eu
testhome="$(mktemp -d)"
trap 'rm -rf "$testhome"' EXIT

# Clearing HOME is not enough: this desktop exports XDG_* pointing back at the
# real ~/.config, so chezmoi and mise would read and write the live config. CI
# has no XDG_* set, so only local runs need this.
clean_env="env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME"

# mise resolves release tags through the GitHub API; unauthenticated calls share
# the machine's 60/hour and the all-or-nothing install then dies on 403.
if [ -z "${MISE_GITHUB_TOKEN:-}" ] && command -v gh >/dev/null 2>&1; then
	MISE_GITHUB_TOKEN="$(gh auth token 2>/dev/null || true)"
	export MISE_GITHUB_TOKEN
fi

$clean_env HOME="$testhome" chezmoi init --source "$PWD" </dev/null >/dev/null
$clean_env HOME="$testhome" chezmoi apply --source "$PWD" </dev/null

# The same assertion CI's bootstrap job makes. Run from /, with $clean_env and
# the config pinned: mise merges a config from every ancestor of the cwd, the
# XDG vars would point it at the live machine, and its global config dir does
# not always follow $HOME. Any of the three makes this check pass vacuously.
# mise's own failures are errors, not an empty tool list.
errlog="$(mktemp)"
if ! missing="$(cd / && $clean_env HOME="$testhome" MISE_GLOBAL_CONFIG_FILE="$testhome/.config/mise/config.toml" PATH="$testhome/.local/bin:$PATH" mise ls --missing 2>"$errlog")"; then
	echo "mise could not list tools in the throwaway HOME:" >&2
	cat "$errlog" >&2
	rm -f "$errlog"
	exit 1
fi
rm -f "$errlog"
if [ -n "$missing" ]; then
	echo "configured mise tools are not installed:" >&2
	printf '%s\n' "$missing" >&2
	exit 1
fi
echo "clean-HOME apply succeeded, all configured tools present"
'''

[tasks.shells]
description = "start each interactive shell and fail on startup noise or errors"
# Neither rc file is in the shellcheck list (they are sourced, not executed, and
# full of shell-specific syntax) and the clean-HOME bootstrap never starts a
# shell — so a typo in an init line ships silently and only shows up the next
# time a terminal is opened. `-i` is the point: the tool integrations this
# guards all live in the interactive path. This reads the *applied* files in
# $HOME, not the source tree, so run `chezmoi apply` first.
run = '''
set -eu
rc=0
# Giving the checked shell a real pty (below, via `script`) has a side effect
# beyond the tty noise it's there to fix: mise's own shell hooks (`eval "$(mise
# activate ...)"` in both rc files) detect that stdout is now a terminal and
# emit an OSC 9;4 progress escape on startup. That's mise reacting to the pty
# this task handed it, not an rc-file regression, so it's silenced the same
# way as the tty noise below — by not producing it in the first place.
export MISE_TERMINAL_PROGRESS=false
for shell in zsh bash; do
	if ! command -v "$shell" >/dev/null 2>&1; then
		echo "skip  $shell (not installed)"
		continue
	fi
	# Both streams captured: a failing init line prints to stderr, a noisy but
	# successful one to stdout. Either is a finding.
	if command -v script >/dev/null 2>&1; then
		out="$(script -qec "$shell -ic true" /dev/null 2>&1 </dev/null)" && status=0 || status=$?
	else
		out="$("$shell" -ic true 2>&1 </dev/null)" && status=0 || status=$?
	fi
	if [ "$status" -eq 0 ]; then
		if [ -n "$out" ]; then
			echo "FAIL  $shell started but printed output:" >&2
			printf '%s\n' "$out" >&2
			rc=1
		else
			echo "ok    $shell"
		fi
	else
		echo "FAIL  $shell exited non-zero:" >&2
		printf '%s\n' "$out" >&2
		rc=1
	fi
done
exit "$rc"
'''

[tasks.secrets-check]
description = "check every secret in Proton Pass is still readable"
# Nothing else exercises the restore path: a renamed item or lapsed grant stays
# silent until a machine is rebuilt. Reports lengths only, never contents.
run = '''
set -eu
rc=0
for title in "ssh auth key" "git signing key" "aur ssh key" \
             "sops age keys" "gh hosts.yml" "sugarrush config" "devpod dotfiles-env"; do
	case "$title" in
	*"ssh"*key | *"signing key") field=private_key ;;
	*) field=note ;;
	esac
	n="$(pass-cli item view --vault-name Dotfiles --item-title "$title" --field "$field" 2>/dev/null | wc -c)"
	if [ "$n" -gt 0 ]; then
		printf 'ok    %-20s %s bytes\n' "$title" "$n"
	else
		printf 'FAIL  %-20s unreadable\n' "$title" >&2
		rc=1
	fi
done
[ "$rc" -eq 0 ] && echo "every secret in the Dotfiles vault is readable"
exit "$rc"
'''

[tasks.prune]
description = "remove mise tool installs no longer referenced by any tracked config"
# Never run from a chezmoi apply: a machine that has not opened a project
# recently has not tracked its mise.toml, and pruning there forces a
# re-download. Manual only, and it shows the dry run first.
run = '''
set -eu
mise prune --dry-run
printf 'Continue? [y/N] '
read -r reply
case "$reply" in
y|Y) mise prune ;;
*) echo "nothing removed" ;;
esac
'''

[tasks.check]
description = "everything CI runs, in one command"
# `shells` is not part of CI — CI has no applied $HOME to start a shell in — but
# it is cheap and catches the one class of breakage the other three miss.
depends = ["lint", "test", "secrets", "verify", "shells"]
