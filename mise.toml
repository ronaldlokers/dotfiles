# Tooling for working ON this repo, not for the machines it configures — those
# tools live in dot_config/mise/config.toml. Pinned so a local `mise run lint`
# and the CI job run byte-identical versions; CI installs from this same file.
#
# Repo-only, so it's listed in .chezmoiignore and never applied into $HOME.

[tools]
shellcheck = "0.11.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
bats = "1.14.0"
# The suite renders a script template, so the tests need chezmoi itself. Kept at
# the same version as the machines install; the lint task below asserts all
# three copies of this number agree.
chezmoi = "2.72.0"
# renovate stays an `npx --yes` call rather than a mise tool: it is run by this
# one lint line only.

[tasks.lint]
description = "shellcheck the scripts and validate the JSON/Renovate config"
run = [
	# Hand-kept rather than globbed, because a glob wide enough to catch `setup`
	# and tests/helpers.bash also catches vendored trees. `check-agreement.sh
	# shellcheck-targets` asserts the list is complete, which is what stops a
	# hand-kept list going stale: scripts/check-shells.sh had a bats file of its
	# own and was never once shellchecked.
	"shellcheck --severity=warning setup home/.chezmoiscripts/*.sh.tmpl home/.chezmoiscripts/run_after_13-ensure-ssh-include.sh home/dot_claude/executable_statusline.sh home/dot_claude/modify_settings.json home/dot_config/shell/ssh-agent.sh home/dot_config/shell/github-token.sh home/dot_local/share/exact_devcontainer-template/post-create.sh home/dot_local/bin/executable_agent-status home/dot_local/bin/executable_devcontainer-init home/dot_local/bin/executable_devpod home/dot_local/bin/executable_dotfiles-secrets-check home/dot_local/bin/executable_dotfiles-secrets-export home/dot_local/bin/executable_dotfiles-secrets-restore home/dot_local/bin/executable_dotfiles-status home/dot_local/bin/executable_dotfiles-update-check.tmpl home/dot_local/bin/executable_hypr-columns home/dot_local/bin/executable_proton-ssh-load home/dot_local/bin/executable_repos-sync home/dot_claude/hooks/executable_rtk-rewrite.sh scripts/check-agreement.sh scripts/check-shells.sh tests/helpers.bash",
	# The workflows lint themselves: a typo in a job key or a bad `needs:`
	# reference otherwise only shows up as a skipped job on a green PR.
	"actionlint",
	# modify_settings.json's own behaviour — valid JSON out, the no-jq fallback,
	# the fixed-point property — is covered by tests/modify-settings.bats. Two
	# unreadable one-liners used to live here instead.
	# renovate: datasource=npm depName=renovate
	"npx --yes --package renovate@43.285.0 renovate-config-validator .github/renovate.json",
	# The facts this repo states in more than one place — the three chezmoi
	# versions, the vault name, the two container markers, the bootstrap PAT's
	# expiry, the vendored graphify skill's version, the cached PAT's path. Each
	# is duplicated on purpose (hoisting any of them would be worse; the script
	# says why for each one), and this is what stops the duplication rotting.
	# The shellcheck target list above is the one entry that is not a
	# duplicated fact but a hand-kept list, asserted complete for the same
	# reason: nothing else would notice a script falling off it.
	#
	# It was five multi-line shell one-liners embedded in TOML strings here.
	# They are in a file now for one reason: they can be tested, and one of them
	# was wrong. The container-marker check had no floor on how many files it
	# found, so a moved directory or a changed spelling would have made it pass
	# by scanning nothing — reporting success for exactly the reason that should
	# have alarmed it. tests/check-agreement.bats now drives each check against
	# a fixture tree with the drift deliberately introduced.
	"sh scripts/check-agreement.sh .",
]

[tasks.test]
description = "run the bats suite against the scripts"
# These cover the branches a clean-HOME apply never reaches. `verify` proves an
# apply succeeds on an empty machine; it says nothing about what the ssh-include
# script does to a config that already has a Host block in it, or what the
# statusline prints when the context percentage arrives as a bare fraction.
run = "bats --print-output-on-failure tests/"

[tasks.secrets]
description = "scan the full history for committed secrets, as CI does"
run = "gitleaks git --no-banner ."

[tasks.verify]
description = "bootstrap into a throwaway HOME the way CI does"
# </dev/null is the point of the exercise, not an afterthought: it's what makes
# this reproduce `devpod up` and CI, where scripts have no TTY to prompt on. A
# run that inherits a terminal silently exercises a different code path.
run = '''
set -eu
testhome="$(mktemp -d)"
trap 'rm -rf "$testhome"' EXIT

# Clearing HOME is not enough: this desktop exports XDG_* pointing back at the
# real ~/.config, so chezmoi and mise would read and write the live config. CI
# has no XDG_* set, so only local runs need this.
#
# XDG_RUNTIME_DIR belongs in that list for a sharper reason than the rest. The
# three run_onchange_after_1x scripts decide whether a systemd user manager is
# running by probing $XDG_RUNTIME_DIR/systemd/private, and on a developer
# desktop that socket is the *real* session's. A throwaway-HOME apply would
# therefore reach past its own HOME and run `systemctl --user daemon-reload`
# and `enable --now` against the machine actually being used — this task exists
# to prove an apply works on an empty machine, not to reconfigure this one.
# Clearing it makes the probe fail and those scripts take their no-session
# branch, which is the branch a genuinely empty machine takes anyway. The real
# enable path is covered by CI's host-ssh-agent job, on a session built for it.
clean_env="env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME -u XDG_RUNTIME_DIR"

# mise resolves release tags through the GitHub API; unauthenticated calls share
# the machine's 60/hour and the all-or-nothing install then dies on 403.
if [ -z "${MISE_GITHUB_TOKEN:-}" ] && command -v gh >/dev/null 2>&1; then
	MISE_GITHUB_TOKEN="$(gh auth token 2>/dev/null || true)"
	export MISE_GITHUB_TOKEN
fi

$clean_env HOME="$testhome" chezmoi init --source "$PWD" </dev/null >/dev/null
$clean_env HOME="$testhome" chezmoi apply --source "$PWD" </dev/null

# The same assertion CI's bootstrap job makes. Run from /, with $clean_env and
# the config pinned: mise merges a config from every ancestor of the cwd, the
# XDG vars would point it at the live machine, and its global config dir does
# not always follow $HOME. Any of the three makes this check pass vacuously.
# mise's own failures are errors, not an empty tool list.
errlog="$(mktemp)"
if ! missing="$(cd / && $clean_env HOME="$testhome" MISE_GLOBAL_CONFIG_FILE="$testhome/.config/mise/config.toml" PATH="$testhome/.local/bin:$PATH" mise ls --missing 2>"$errlog")"; then
	echo "mise could not list tools in the throwaway HOME:" >&2
	cat "$errlog" >&2
	rm -f "$errlog"
	exit 1
fi
rm -f "$errlog"
if [ -n "$missing" ]; then
	echo "configured mise tools are not installed:" >&2
	printf '%s\n' "$missing" >&2
	exit 1
fi
echo "clean-HOME apply succeeded, all configured tools present"
'''

[tasks.shells]
description = "start each interactive shell and fail on startup noise or errors"
# The check itself is scripts/check-shells.sh, so CI's bootstrap job can run the
# same one against its throwaway HOME. It reads the *applied* files in $HOME,
# not the source tree, so run `chezmoi apply` first.
run = "sh scripts/check-shells.sh"

[tasks.secrets-check]
description = "check every secret in Proton Pass is still readable"
# Nothing else exercises the restore path: a renamed item or lapsed grant stays
# silent until a machine is rebuilt. Reports lengths only, never contents.
run = "sh home/dot_local/bin/executable_dotfiles-secrets-check --source ."

[tasks.prune]
description = "remove mise tool installs no longer referenced by any tracked config"
# Never run from a chezmoi apply: a machine that has not opened a project
# recently has not tracked its mise.toml, and pruning there forces a
# re-download. Manual only, and it shows the dry run first.
run = '''
set -eu
mise prune --dry-run
printf 'Continue? [y/N] '
# `read` returns non-zero at EOF, and under `set -e` that killed the task
# outright: piping anything in, or running it where stdin is closed, ended in a
# bare exit 1 with no output rather than the "nothing removed" this obviously
# means. Declining is not an error.
if ! read -r reply; then
	echo
	echo "nothing removed"
	exit 0
fi
case "$reply" in
y|Y) mise prune ;;
*) echo "nothing removed" ;;
esac
'''

[tasks.check]
description = "everything CI runs, in one command"
# `shells` runs in CI too now, against the bootstrap job's throwaway HOME —
# which is a *better* subject than this machine's, because it is what a fresh
# install actually produces rather than a HOME with years of accumulated state.
# It stays here as well: this is the copy that catches a change before it is
# pushed.
depends = ["lint", "test", "secrets", "verify", "shells"]
