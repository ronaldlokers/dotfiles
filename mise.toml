# Tooling for working ON this repo, not for the machines it configures — those
# tools live in dot_config/mise/config.toml. Pinned so a local `mise run lint`
# and the CI job run byte-identical versions; CI installs from this same file.
#
# Repo-only, so it's listed in .chezmoiignore and never applied into $HOME.

[tools]
shellcheck = "0.11.0"
gitleaks = "8.30.1"
# renovate is deliberately NOT a `npm:renovate` tool here. mise's npm backend
# enforces a provenance trust policy, and renovate's tree currently trips it:
# @yarnpkg/libzip 3.2.0 shipped a SLSA attestation, 3.2.2 ships none, which
# reads as a trust downgrade and fails the install. Silencing that with
# trust_policy_excludes would be a real security decision, not a build fix, so
# the validator is invoked through a version-pinned npx in the lint task below.
# The pin is the part that matters: the original bug was an *unversioned*
# `--package renovate`, which reuses whatever is already in the npx cache.

[tasks.lint]
description = "shellcheck the scripts and validate the JSON/Renovate config"
run = [
	"shellcheck --severity=warning setup home/.chezmoiscripts/*.sh.tmpl home/.chezmoiscripts/run_after_12-ensure-ssh-include.sh home/dot_claude/executable_statusline.sh home/dot_claude/modify_settings.json home/dot_config/shell/ssh-agent.sh home/dot_config/shell/github-token.sh home/dot_local/share/devcontainer-template/post-create.sh home/dot_local/bin/executable_devcontainer-init",
	# dot_claude/settings.json no longer exists (it's now a modify_ script's
	# baseline, merged at apply time) so there is nothing static left to
	# `jq empty`. What matters now is that the script itself still emits
	# valid JSON. Feed it representative input with a key the repo doesn't
	# manage, so this exercises the real jq merge path — not just the
	# empty-stdin baseline shortcut.
	#
	# A plain pipeline can't be trusted to report the middle command's
	# failure here: `jq empty` exits 0 on *empty* stdin, so if
	# modify_settings.json died and printed nothing, `... | jq empty` would
	# still exit 0. `pipefail` would fix that, but it isn't portable to the
	# shell mise actually runs this in -- mise's default task shell is
	# plain `sh -c -o errexit` (`mise settings get
	# unix_default_inline_shell_args`), and on Debian/Ubuntu (this repo's
	# CI runner included) `/bin/sh` is dash, which has no `-o pipefail` and
	# aborts the whole task on the attempt. Capture the script's output in
	# a command substitution instead: `out="$(...)"` takes on the
	# substituted command's own exit status, and mise's `errexit` aborts
	# this task line right there if it's non-zero -- no shell-specific
	# option required, and no pipe to swallow anything.
	"out=\"$(echo '{\"agentPushNotifEnabled\": true}' | ./home/dot_claude/modify_settings.json)\"; printf '%s' \"$out\" | jq empty",
	# The no-jq fallback path (see modify_settings.json's comments) is only
	# ever exercised by hand-testing today -- `jq` is a system package on
	# this host *and* on GitHub's ubuntu-latest runners (normally sitting
	# right next to `cat` in /usr/bin), so a bare `mise run lint`/`verify`
	# never actually runs the script without jq on PATH; excluding jq's
	# mise install alone wouldn't be enough. Build a scratch PATH holding
	# only a symlink to `cat` -- the one external command the script's
	# no-jq path needs (`command -v jq` and `printf` are bash builtins, so
	# nothing else has to resolve) -- so jq is genuinely unreachable, and
	# confirm the fallback still emits valid JSON rather than failing the
	# apply. `jq empty` itself runs with the real PATH restored, so
	# validation doesn't depend on the thing being excluded.
	#
	# Stdin here has to be non-empty, unlike the check above feeding this
	# same script: an *empty* stdin hits modify_settings.json's very first
	# branch (no on-disk file yet) and returns before the script ever gets
	# to `command -v jq` at all, regardless of what's on PATH. `< /dev/null`
	# here would build the whole scratch-PATH apparatus and then exercise
	# nothing with it -- the empty-stdin branch, not the no-jq fallback,
	# would be what actually ran. Piping in the same representative JSON as
	# the check above is what forces execution to reach, and exercise, the
	# `printf '%s\n' "$current"` fallback line.
	#
	# Same command-substitution shape as the check above, for the same
	# dash-portability reason -- see its comment for why a bare pipeline
	# can't be trusted here either. The scratch dir is cleaned up via
	# `trap ... EXIT` (mirroring [tasks.verify] below) rather than a
	# manual `rm` at the end, so it's removed even if errexit aborts this
	# line early on a failure.
	"d=$(mktemp -d); trap 'rm -rf \"$d\"' EXIT; ln -s \"$(command -v cat)\" \"$d/cat\"; out=\"$(echo '{\"agentPushNotifEnabled\": true}' | PATH=\"$d\" ./home/dot_claude/modify_settings.json)\"; printf '%s' \"$out\" | jq empty",
	# renovate: datasource=npm depName=renovate
	"npx --yes --package renovate@43.285.0 renovate-config-validator .github/renovate.json",
	# Two files now carry a chezmoi version: the .chezmoiversion floor and the
	# mise pin every machine actually installs. Renovate bumps the pin; this is
	# what says "bump the floor too". A multi-line literal ('''), because the
	# sed script needs single quotes and a double-quoted TOML string would need
	# every " and \ escaped.
	'''v="$(cat .chezmoiversion)"; p="$(sed -n 's/^chezmoi = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)"; [ "$v" = "$p" ] || { echo ".chezmoiversion ($v) and the mise chezmoi pin ($p) disagree" >&2; exit 1; }''',
]

[tasks.secrets]
description = "scan the full history for committed secrets, as CI does"
run = "gitleaks git --no-banner ."

[tasks.verify]
description = "bootstrap into a throwaway HOME the way CI does"
# </dev/null is the point of the exercise, not an afterthought: it's what makes
# this reproduce `devpod up` and CI, where scripts have no TTY to prompt on. A
# run that inherits a terminal silently exercises a different code path.
run = '''
set -eu
testhome="$(mktemp -d)"
trap 'rm -rf "$testhome"' EXIT

# Clearing HOME is not enough to get a clean run: this desktop exports
# XDG_CONFIG_HOME and friends pointing back at the real ~/.config, so chezmoi
# and mise keep reading — and writing — the live config even with HOME
# redirected. A drill once regenerated the real ~/.config/chezmoi/chezmoi.toml
# that way. CI has no XDG_* set, so only local runs need this.
clean_env="env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME"

# mise resolves release tags through the GitHub API, and unauthenticated calls
# share the machine's 60/hour. A few clean-HOME runs in a row exhaust it and the
# all-or-nothing tool install then dies on HTTP 403 — a failure that looks like
# a broken config but isn't. CI already passes a token for this reason; borrow
# the gh one locally so both behave the same.
if [ -z "${MISE_GITHUB_TOKEN:-}" ] && command -v gh >/dev/null 2>&1; then
	MISE_GITHUB_TOKEN="$(gh auth token 2>/dev/null || true)"
	export MISE_GITHUB_TOKEN
fi

$clean_env HOME="$testhome" chezmoi init --source "$PWD" </dev/null >/dev/null
$clean_env HOME="$testhome" chezmoi apply --source "$PWD" </dev/null

# The same assertion CI's bootstrap job makes. It lives here too because the
# first version of this task didn't have it, and CI caught a failure that a
# green local run had just missed — which is the exact gap this file exists to
# close. Run from $testhome: mise merges configs up the cwd hierarchy, so
# standing in the repo would pull in this very file and report the repo's lint
# tooling as missing dotfiles tools.
missing="$(cd "$testhome" && HOME="$testhome" PATH="$testhome/.local/bin:$PATH" mise ls --missing 2>/dev/null || true)"
if [ -n "$missing" ]; then
	echo "configured mise tools are not installed:" >&2
	printf '%s\n' "$missing" >&2
	exit 1
fi
echo "clean-HOME apply succeeded, all configured tools present"
'''

[tasks.shells]
description = "start each interactive shell and fail on startup noise or errors"
# Neither rc file is in the shellcheck list (they are sourced, not executed, and
# full of shell-specific syntax) and the clean-HOME bootstrap never starts a
# shell — so a typo in an init line ships silently and only shows up the next
# time a terminal is opened. `-i` is the point: the tool integrations this
# guards all live in the interactive path. This reads the *applied* files in
# $HOME, not the source tree, so run `chezmoi apply` first.
run = '''
set -eu
rc=0
# Giving the checked shell a real pty (below, via `script`) has a side effect
# beyond the tty noise it's there to fix: mise's own shell hooks (`eval "$(mise
# activate ...)"` in both rc files) detect that stdout is now a terminal and
# emit an OSC 9;4 progress escape on startup. That's mise reacting to the pty
# this task handed it, not an rc-file regression, so it's silenced the same
# way as the tty noise below — by not producing it in the first place.
export MISE_TERMINAL_PROGRESS=false
for shell in zsh bash; do
	if ! command -v "$shell" >/dev/null 2>&1; then
		echo "skip  $shell (not installed)"
		continue
	fi
	# Both streams are captured: an init line that fails prints to stderr,
	# and one that accidentally echoes prints to stdout. A clean interactive
	# startup says nothing on either.
	#
	# A shell with no controlling terminal on any fd — this task's own
	# subshell, whenever mise itself runs from a context with no pty
	# attached (an agent's tool sandbox, some other headless wrapper) —
	# prints tty-acquisition noise that has nothing to do with the rc
	# files: zsh's fzf integration can't restore the `zle` option on exit,
	# bash can't claim a process group for job control. The whole point of
	# this check is catching rc-file regressions, not tty plumbing, so give
	# the shell a real pty via `script` when one is installed. `-e`
	# (bundled into `-qec`) makes `script` return the wrapped command's own
	# exit code rather than its own, so the non-zero-exit branch below
	# still means what it says. Falls back to the direct, tty-less form
	# when `script` is missing; that fallback can still report tty noise
	# instead of a real rc-file problem.
	if command -v script >/dev/null 2>&1; then
		out="$(script -qec "$shell -ic true" /dev/null 2>&1 </dev/null)" && status=0 || status=$?
	else
		out="$("$shell" -ic true 2>&1 </dev/null)" && status=0 || status=$?
	fi
	if [ "$status" -eq 0 ]; then
		if [ -n "$out" ]; then
			echo "FAIL  $shell started but printed output:" >&2
			printf '%s\n' "$out" >&2
			rc=1
		else
			echo "ok    $shell"
		fi
	else
		echo "FAIL  $shell exited non-zero:" >&2
		printf '%s\n' "$out" >&2
		rc=1
	fi
done
exit "$rc"
'''

[tasks.secrets-restore]
description = "check every .age blob still decrypts with the configured identity"
# The recovery path in README.md is the only thing standing between a dead
# machine and every secret in here, and nothing exercises it — a blob encrypted
# to the wrong recipient, or corrupted by a bad merge, stays silent until the
# day it's needed. CI can't cover this (it has no identity), so it's a local
# task. Deliberately not part of `check`: it needs an unlocked key.txt.
run = '''
set -eu
key="${HOME}/.config/chezmoi/key.txt"
if [ ! -f "$key" ]; then
	echo "no age identity at $key — run an interactive 'chezmoi apply' first"
	exit 0
fi
rc=0
# key.txt.age is excluded on purpose: it's passphrase-protected rather than
# identity-encrypted, so it can't be checked without a TTY — and it is the very
# thing every other blob is checked with.
for blob in $(git ls-files '*.age' | grep -v '^home/key\.txt\.age$'); do
	# `| wc -c` rather than reading the plaintext into a variable: this only
	# needs to know the blob produced bytes, and counting them keeps the
	# secret out of the shell's memory and any `set -x` output. (An earlier
	# `head -c1 | read` was wrong here — read reports failure at EOF when
	# there's no trailing newline, so every blob looked broken.)
	if size="$(chezmoi decrypt "$blob" 2>/dev/null | wc -c)" && [ "$size" -gt 0 ]; then
		echo "ok    $blob"
	else
		echo "FAIL  $blob (does not decrypt, or decrypts empty)"
		rc=1
	fi
done
[ "$rc" -eq 0 ] && echo "all blobs decrypt with the current identity"
exit "$rc"
'''

[tasks.check]
description = "everything CI runs, in one command"
# `shells` is not part of CI — CI has no applied $HOME to start a shell in — but
# it is cheap and catches the one class of breakage the other three miss.
depends = ["lint", "secrets", "verify", "shells"]
