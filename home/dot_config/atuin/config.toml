# Local-only: no account, no sync, no network call at shell start. A container
# keeps its own database and loses it with the container.
auto_sync = false

# mise owns the version, so silence atuin's own update prompt.
update_check = false

# Up searches this directory only; Ctrl-R searches everything.
filter_mode_shell_up_key_binding = "directory"

# Enter puts the selected command on the command line instead of running it,
# matching what fzf's Ctrl-R widget did before atuin took the binding. A picker
# that executes on Enter turns a misfire into a run command.
enter_accept = false

# `style` is pinned rather than left implicit: it's already atuin 18.17.1's
# default (inline, not fullscreen), but spelling it out here means a future
# atuin release changing that default can't silently wipe the scrollback that
# prompted the search in the first place. `inline_height` IS an override —
# atuin defaults to 40 lines; 20 leaves more of the scrollback visible above
# the picker.
style = "compact"
inline_height = 20
