# Tell the moshi-hook daemon where herdr is.
#
# The unit that `moshi-hook service install` generates hardcodes
# `Environment=PATH=/usr/local/bin:/usr/bin:/bin`, and herdr is a mise shim in
# ~/.local/share/mise/shims. So the daemon cannot resolve `herdr` at all, and
# the symptom is not an error anywhere — Moshi simply reports no workspaces,
# which reads like herdr not being supported rather than not being found.
#
# This is the case MOSHI_HERDR_PATH is documented for: "absolute path to the
# herdr CLI when a service manager cannot discover it from PATH".
#
# A drop-in rather than an edit to the unit, because the unit is generated:
# `moshi-hook service install` runs on every apply once this host is paired and
# would overwrite anything written into it. Drop-ins are separate files and
# survive that.
#
# The shim path, not the versioned install path under
# ~/.local/share/mise/installs/. The shim is stable across version bumps, and it
# resolves correctly even under the unit's minimal PATH — checked, because a
# shim that needed mise on PATH would have moved the problem rather than fixed
# it.
[Service]
Environment=MOSHI_HERDR_PATH=%h/.local/share/mise/shims/herdr
