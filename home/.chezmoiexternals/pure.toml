# The checksums below are on GitHub's *generated* tag tarballs, which is a
# weaker pin than mise's or devpod's release assets and worth being precise
# about. A tag is mutable — a maintainer can move it, and nothing about the URL
# would change — so without a hash "pinned to v1.2.3" means "pinned to whatever
# v1.2.3 points at today". The hash closes that. What it cannot promise is
# permanence in the other direction: GitHub generates these archives on demand
# and has changed their gzip framing once before, which would fail the apply
# even though nothing upstream moved.
#
# That failure mode is the right one. A loud apply failure asks a human to look;
# a silently different plugin sourced into every interactive shell does not.
# Each hash was taken twice, from separate fetches, to confirm the archive is
# byte-stable as served today.
#
# Renovate cannot update these lines, so a version bump that leaves one stale
# fails the apply. Bump version and hash together.
# renovate: datasource=github-tags depName=sindresorhus/pure
{{ $pureVersion := "v1.28.3" }}
[".zsh/pure"]
type = "archive"
url = "https://github.com/sindresorhus/pure/archive/refs/tags/{{ $pureVersion }}.tar.gz"
checksum.sha256 = "738b523c59823083de490b3eb6c1116fc45c342e6b32a7d3cf05fdd0f8aa75a8"
stripComponents = 1
refreshPeriod = "168h"
