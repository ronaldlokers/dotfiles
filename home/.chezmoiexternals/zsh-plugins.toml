# The checksums below are on GitHub's *generated* tag tarballs, which is a
# weaker pin than mise's or devpod's release assets and worth being precise
# about. A tag is mutable — a maintainer can move it, and nothing about the URL
# would change — so without a hash "pinned to v1.2.3" means "pinned to whatever
# v1.2.3 points at today". The hash closes that. What it cannot promise is
# permanence in the other direction: GitHub generates these archives on demand
# and has changed their gzip framing once before, which would fail the apply
# even though nothing upstream moved.
#
# That failure mode is the right one. A loud apply failure asks a human to look;
# a silently different plugin sourced into every interactive shell does not.
# Each hash was taken twice, from separate fetches, to confirm the archive is
# byte-stable as served today.
#
# Renovate cannot update these lines, so a version bump that leaves one stale
# fails the apply. Bump version and hash together.
# renovate: datasource=github-tags depName=zsh-users/zsh-autosuggestions
{{ $autosuggestionsVersion := "v0.7.1" }}
# renovate: datasource=github-tags depName=Aloxaf/fzf-tab
{{ $fzfTabVersion := "v1.3.0" }}
# renovate: datasource=github-tags depName=zsh-users/zsh-syntax-highlighting
{{ $syntaxHighlightingVersion := "0.8.0" }}
[".zsh/zsh-autosuggestions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/{{ $autosuggestionsVersion }}.tar.gz"
checksum.sha256 = "0df7affff21cd87ed298e6a3970ed08a1dd66a6efa676454ee5b091ad503badf"
stripComponents = 1
refreshPeriod = "168h"

[".zsh/fzf-tab"]
type = "archive"
url = "https://github.com/Aloxaf/fzf-tab/archive/refs/tags/{{ $fzfTabVersion }}.tar.gz"
checksum.sha256 = "d75ac08c2c8af5a6a0478787b0f11fabbe24951973b7841ae963431e2070ee9a"
stripComponents = 1
refreshPeriod = "168h"

[".zsh/zsh-syntax-highlighting"]
type = "archive"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ $syntaxHighlightingVersion }}.tar.gz"
checksum.sha256 = "5981c19ebaab027e356fe1ee5284f7a021b89d4405cc53dc84b476c3aee9cc32"
stripComponents = 1
refreshPeriod = "168h"
