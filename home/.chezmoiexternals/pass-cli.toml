{{- /* Proton Pass CLI. Host-only: a container has no Proton session.

       An external rather than a mise pin because Proton ships it from
       proton.me and it is not in the mise registry. Bump by hand — version and
       hash come as a pair from
       https://proton.me/download/pass-cli/versions.json, which is why Renovate
       is not wired up. */ -}}
{{- if and (eq (includeTemplate "is-container" .) "false") (eq .chezmoi.os "linux") (eq .chezmoi.arch "amd64") -}}
{{ $passCliVersion := "2.2.3" }}
[".local/bin/pass-cli"]
type = "file"
executable = true
url = "https://proton.me/download/pass-cli/{{ $passCliVersion }}/pass-cli-linux-x86_64"
checksum.sha256 = "7188f02a7c1e79a860f7166ad2c34f7a2e6c961265b70677e2704f216dd176d9"
refreshPeriod = "168h"
{{- end -}}
