{{- $miseVersion := "v2026.7.14" -}}
# mise binary, pinned to an immutable release asset (linux-x64). Renovate bumps
# $miseVersion via the custom manager in .github/renovate.json.
[".local/bin/mise"]
type = "file"
executable = true
url = "https://github.com/jdx/mise/releases/download/{{ $miseVersion }}/mise-{{ $miseVersion }}-linux-x64"
refreshPeriod = "168h"
