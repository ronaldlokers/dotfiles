[tools]
bat = "0.26.1"
chezmoi = "2.70.5"
claude-code = "2.1.220"
fzf = "0.74.1"
lsd = "1.2.0"
fd = "10.4.2"
lazygit = "0.63.1"
node = "26.4.0"
# mason installs pip-backed packages (ruff) into a venv; without a
# python3 on PATH those installs fail
python = "3.14.6"
ripgrep = "15.1.0"
neovim = "0.12.4"
direnv = "2.37.1"
# Shell history in SQLite: fuzzy search, exit status, and per-directory
# filtering on the Up arrow. Sync is off (see ~/.config/atuin/config.toml), so
# there is no account and no network call at shell start. 18.17.1 is the newest
# release visible under this repo's minimum_release_age setting.
atuin = "18.17.1"
yq = "4.53.3"
jq = "1.8.2"
kubeconform = "0.8.0"
gemini-cli = "0.49.0"
delta = "0.19.2"
zoxide = "0.10.0"
gh = "2.96.0"
tmux = "3.7b"
# One picker over live tmux sessions plus zoxide's frecency list; picking an
# entry attaches or creates. Not in the mise registry, so the github backend
# fetches the release binary directly — same arrangement as the sugarrush pin
# further down. Renovate's mise manager understands `github:` pins natively.
"github:joshmedeski/sesh" = "2.28.0"
# Channel-based fuzzy finder. Takes Ctrl-T, Alt-C and the sesh picker off fzf,
# and puts every channel — git branches, k8s pods, systemd units — one
# keystroke away. fzf stays pinned regardless: fzf-tab, the zsh completion
# menu loaded from dot_zshrc, is built on it.
television = "0.15.9"
# both are in Arch's extra repo too, but they're TUIs — wanted inside devpod
# containers as much as on the host, so mise pins them instead of pacman
yazi = "26.5.6"
superfile = "1.6.0"
# Coreutils replacements — du (dust), df (duf), top (btop), sed (sd) and a
# JSON pager (jless), plus hyperfine for benchmarking and gping for a plotted
# ping. In mise rather than the host package list for the same reason as yazi
# and superfile: a devpod container has no pacman, so anything not pinned here
# simply isn't there.
dust = "1.2.4"
duf = "0.9.1"
btop = "1.4.7"
sd = "1.1.0"
jless = "0.9.0"
hyperfine = "1.20.0"
gping = "1.20.4"
# github, not cargo: the cargo backend compiles from source and so needs a Rust
# toolchain, while this pulls the cargo-dist binary straight from the release
# and verifies its SLSA provenance. (Not `ubi:` — mise deprecated that backend
# in favour of `github:`, removal in 2027.1.0.)
"github:ronaldlokers/sugarrush" = "2026.7.3"
# rtk-ai/rtk, the CLI proxy the Claude Code PreToolUse hook routes commands
# through (dot_claude/hooks/rtk-rewrite.sh). Previously built from source by a
# run_onchange script pinned to a commit SHA, which meant no Rust toolchain, no
# rtk — so every devpod container skipped it and said so on each bootstrap.
# Upstream publishes prebuilt binaries and the registry entry resolves to
# rtk-ai/rtk, so a plain pin works everywhere and Renovate bumps it. Watch the
# name collision noted in dot_claude/CLAUDE.md: reachingforthejack/rtk is a
# different tool ("Rust Type Kit"). `rtk gain` working is the cheap check.
rtk = "0.43.0"
# chezmoi decrypts with a built-in age normally, but built-in age can't load
# plugins — so driving a YubiKey-backed identity means pointing age.command at
# a real binary, and every machine that decrypts a secret then needs one.
age = "1.3.1"
# NB: age-plugin-yubikey is NOT here. Its GitHub releases ship darwin and
# windows assets only, so the github backend has nothing to fetch on linux —
# Arch packages it in extra instead, and it's host-only regardless since it
# exists to talk to physical hardware. See the host package list.
# nvim-treesitter (main branch) shells out to the tree-sitter CLI to
# compile parsers; without it :TSUpdate fails and parsers go stale
tree-sitter = "0.26.11"
uv = "0.11.32"
# uvx_args: pomo imports typing_extensions but doesn't declare it; on
# python >=3.14 nothing pulls it in transitively anymore
"pipx:git+https://github.com/mischavandenburg/pomo.git" = { version = "v0.4.0", uvx_args = "--with typing-extensions" }

[settings]
# run pipx-backend tools through uvx so no system python/pipx is needed
pipx.uvx = true
