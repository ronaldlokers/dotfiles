name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly canary before the Renovate runs: externals and the chezmoi
    # installer can break independently of commits
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The checks themselves live in mise.toml, which also pins the tools that
      # run them. Previously this job used the runner's shellcheck and an `npx
      # --yes` renovate, so "CI is green" said nothing about which versions a
      # contributor had locally — the validator in particular passed here and
      # failed on a developer machine with a stale npx cache.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: lint
        run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Same reasoning as the lint job: the suite and the bats that runs it are
      # both pinned in mise.toml, so a local run and this one are identical.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: test
        run: mise run test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bootstrap:
    runs-on: ubuntu-latest
    env:
      # authenticate mise's GitHub API calls (release-tag lookups) with the
      # workflow token: unauthenticated requests share the runner IP's 60/hr
      # limit and intermittently 403, aborting the all-or-nothing install.
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
      - name: bootstrap into a clean HOME
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          TESTHOME="$(mktemp -d)"
          echo "TESTHOME=$TESTHOME" >> "$GITHUB_ENV"
          # CI has no passphrase and no tty, same as `devpod up` on a
          # fresh machine: the unlock script detects that and skips
          # decrypting the age identity and the secrets behind it.
          # Everything else runs for real: externals, run scripts, full
          # mise tool install.
          HOME="$TESTHOME" chezmoi init --source "$PWD"
          HOME="$TESTHOME" chezmoi apply --source "$PWD" </dev/null
      - name: idempotency — second apply changes no managed files
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # the design leans on re-run safety (the unlock script and every
          # run_onchange are meant to no-op once settled); prove it. A second
          # apply must exit 0 and leave no managed-file drift.
          HOME="$TESTHOME" chezmoi apply --source "$PWD" </dev/null
          # run_before_00-unlock-secrets is a plain run_before: it re-runs on
          # every apply by design, so chezmoi always lists it as ' R ...'.
          # That's expected — exclude scripts and assert no real file drift.
          pending="$(HOME="$TESTHOME" chezmoi status --source "$PWD" \
            | grep -v '\.chezmoiscripts/' || true)"
          if [ -n "$pending" ]; then
            echo "::error::managed files drift after a second apply — non-idempotent:"
            printf '%s\n' "$pending"
            exit 1
          fi
      - name: assert externals actually landed
        run: |
          # a network blip or upstream rename can leave empty external dirs;
          # the shells source them behind `[ -f ]` guards and stay silent, so
          # assert the real files exist rather than trusting apply's exit code.
          #
          # Two passes, because they fail differently and neither subsumes the
          # other. Every target, derived — catches an external nobody thought
          # to assert. Then the specific file each consumer opens — catches an
          # upstream rename or a stripComponents change that leaves a
          # perfectly non-empty directory with the file moved out from under
          # the guard.
          missing=0

          # Derived from .chezmoiexternals, not restated here. The list this
          # step used to carry by hand had drifted to 7 of 12 targets, and the
          # five it had stopped covering included pass-cli and devpod — the
          # two fetched executables, the ones most worth asserting. Rendering
          # the templates under $TESTHOME resolves the same host/container and
          # platform gates the apply just resolved, so the set matches what
          # was actually fetched rather than what a reader assumed.
          targets="$(for t in home/.chezmoiexternals/*.toml; do
            HOME="$TESTHOME" chezmoi execute-template --source "$PWD" <"$t"
            echo
          done | sed -n 's/^\["\(.*\)"\]$/\1/p')"
          if [ -z "$targets" ]; then
            echo "::error::derived no external targets — the parse broke, not the externals"
            exit 1
          fi
          echo "asserting $(printf '%s\n' "$targets" | wc -l) external targets"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            path="$TESTHOME/$rel"
            if [ -d "$path" ]; then
              # an archive whose include list matches nothing still creates the
              # directory, so emptiness is the failure, not absence
              if [ -z "$(find "$path" -type f -print -quit)" ]; then
                echo "::error::external directory is empty: $path"
                missing=1
              fi
            elif [ ! -s "$path" ]; then
              echo "::error::missing or empty external: $path"
              missing=1
            fi
          done < <(printf '%s\n' "$targets")

          for f in \
            "$TESTHOME/.zsh/pure/pure.zsh" \
            "$TESTHOME/.zsh/zsh-autosuggestions/zsh-autosuggestions.zsh" \
            "$TESTHOME/.zsh/fzf-tab/fzf-tab.plugin.zsh" \
            "$TESTHOME/.zsh/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh" \
            "$TESTHOME/.tmux/plugins/tmux-resurrect/resurrect.tmux" \
            "$TESTHOME/.tmux/plugins/tmux-continuum/continuum.tmux"; do
            if [ ! -s "$f" ]; then
              echo "::error::external landed but the file it is sourced by is not there: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
      - name: smoke-test zsh startup
        run: |
          HOME="$TESTHOME" zsh -ic 'echo "zsh startup OK"'
      - name: smoke-test installed tools
        run: |
          export PATH="$TESTHOME/.local/bin:$PATH"
          # the old `mise ls | head -20` exited 0 regardless (head masks the
          # status), so a tool that failed to install still passed CI. Ask mise
          # directly which configured tools are missing — no hard-coded list to
          # drift from mise/config.toml, and no reliance on interactive-shell
          # PATH activation (which doesn't fire under `zsh -ic`).
          # Run from $TESTHOME, not the checkout: mise merges every config in
          # the cwd hierarchy, so standing in the repo pulls in its own
          # mise.toml — the tooling that lints this repo — and reports the
          # linters there as "missing" dotfiles tools. They are neither
          # installed into the test HOME nor meant to be.
          # (Do not start that line with the linter's own name: shellcheck
          # reads a comment opening with its name as a directive, fails to
          # parse it, and silently stops checking the rest of this script.)
          missing="$(cd "$TESTHOME" && HOME="$TESTHOME" mise ls --missing 2>/dev/null)"
          if [ -n "$missing" ]; then
            echo "::error::configured mise tools are not installed:"
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "all configured mise tools installed"

  host-ssh-agent:
    # The bootstrap job runs the clean-HOME/container path, where there is no
    # systemd user session, so the host-only branch of
    # run_onchange_after_10-enable-ssh-agent (systemctl --user enable ...) and
    # the ssh-agent.service unit are never exercised. Bring up a real user
    # session and run that branch for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: bring up a systemd --user session
        run: |
          sudo loginctl enable-linger "$(id -un)"
          rt="/run/user/$(id -u)"
          for _ in $(seq 1 30); do [ -S "$rt/systemd/private" ] && break; sleep 1; done
          test -S "$rt/systemd/private" \
            || { echo "::error::user systemd session never came up"; exit 1; }
      - name: install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
      - name: place the unit and run the real enable script
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          chezmoi init --source "$PWD"
          # the bootstrap job already tests that chezmoi *places* the unit; here
          # it just needs to be present so the enable script can start it.
          mkdir -p "$HOME/.config/systemd/user"
          cp home/dot_config/systemd/user/ssh-agent.service \
             "$HOME/.config/systemd/user/ssh-agent.service"
          chezmoi execute-template --source "$PWD" \
            < home/.chezmoiscripts/run_onchange_after_10-enable-ssh-agent.sh.tmpl \
            > "$RUNNER_TEMP/enable.sh"
          sh "$RUNNER_TEMP/enable.sh"
      - name: assert the ssh-agent service is active with a live socket
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          # `enable --now` returns as soon as systemd accepts the job, not when
          # ssh-agent has created its socket. Asserting immediately is a race
          # this job lost only occasionally, which is worse than losing it
          # always — it read as a flaky suite rather than a missing wait.
          for _ in $(seq 1 30); do
            systemctl --user is-active --quiet ssh-agent.service \
              && [ -S "$XDG_RUNTIME_DIR/ssh-agent.socket" ] && break
            sleep 1
          done
          # Re-assert outside the loop so a real failure still fails the job,
          # and print why rather than leaving a bare non-zero exit.
          if ! systemctl --user is-active --quiet ssh-agent.service; then
            echo "::error::ssh-agent.service is not active after 30s"
            systemctl --user status ssh-agent.service --no-pager || true
            journalctl --user -u ssh-agent.service -n 20 --no-pager || true
            exit 1
          fi
          if [ ! -S "$XDG_RUNTIME_DIR/ssh-agent.socket" ]; then
            echo "::error::unit is active but $XDG_RUNTIME_DIR/ssh-agent.socket is missing"
            ls -la "$XDG_RUNTIME_DIR" || true
            exit 1
          fi
          echo "host-path ssh-agent verified: unit active, socket present"

  container-gates:
    # The bootstrap job runs on a bare runner, so the container branch of the
    # devpod external, the host-packages script, and the .chezmoiignore block
    # that keeps dotfiles-secrets-check out of a container is never exercised —
    # a broken gate would ship green. Run those for real inside a container.
    #
    # Arch on purpose, not Ubuntu: pacman exists here, so a skip can only come
    # from the container gate. On a distro without pacman the script's
    # no-package-manager branch would make this pass for the wrong reason.
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: install prerequisites
        run: pacman -Sy --noconfirm --needed git curl
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: assert this really is a container
        run: |
          # Both gates key on these markers. If the runner ever stops providing
          # them, every assertion below would pass vacuously — so fail loudly
          # here instead of silently testing nothing.
          if [ ! -f /.dockerenv ] && [ ! -f /run/.containerenv ]; then
            echo "::error::no container marker present; the gates below would pass vacuously"
            exit 1
          fi
          command -v pacman >/dev/null || { echo "::error::pacman missing; skip could be for the wrong reason"; exit 1; }
      - name: install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: devpod external renders to nothing
        run: |
          out="$(chezmoi execute-template --source "$PWD" < home/.chezmoiexternals/devpod.toml)"
          if [ -n "$(printf '%s' "$out" | tr -d '[:space:]')" ]; then
            echo "::error::devpod external is non-empty inside a container:"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "devpod external correctly empty"
      - name: .chezmoiignore excludes dotfiles-secrets-check inside a container
        run: |
          # The script also probes /.dockerenv itself at runtime (belt and
          # braces, since the source-tree copy is reachable from a devcontainer
          # working on this repo) — that runtime probe is exercised by
          # tests/secrets-check.bats. This step is what covers the
          # .chezmoiignore half: the applied copy must never land at all.
          out="$(chezmoi execute-template --source "$PWD" < home/.chezmoiignore)"
          if ! printf '%s\n' "$out" | grep -qx '.local/bin/dotfiles-secrets-check'; then
            echo "::error::.local/bin/dotfiles-secrets-check missing from rendered .chezmoiignore inside a container:"
            printf '%s\n' "$out"
            exit 1
          fi
          echo ".chezmoiignore correctly excludes dotfiles-secrets-check inside a container"
      - name: host-packages script detects the container and skips
        run: |
          chezmoi execute-template --source "$PWD" \
            < home/.chezmoiscripts/run_after_20-install-host-packages.sh.tmpl > /tmp/pkgs.sh
          # The shared .chezmoitemplates/is-container must have resolved true.
          grep -qx 'is_container=true' /tmp/pkgs.sh \
            || { echo "::error::is-container template did not detect the container"; exit 1; }
          # The container gate sits above every echo in the script, so a correct
          # skip is silent. Any output means execution ran past it.
          out="$(bash /tmp/pkgs.sh </dev/null 2>&1)"; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::script exited $rc inside a container, expected 0"
            printf '%s\n' "$out"
            exit 1
          fi
          if [ -n "$out" ]; then
            echo "::error::script produced output, so it ran past the container gate:"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "host-packages script correctly skipped, silently"
      - name: configure-devpod script detects the container and skips
        run: |
          chezmoi execute-template --source "$PWD" \
            < home/.chezmoiscripts/run_onchange_after_30-configure-devpod.sh.tmpl > /tmp/devpod-configure.sh
          # The shared .chezmoitemplates/is-container must have resolved true.
          grep -qx 'is_container=true' /tmp/devpod-configure.sh \
            || { echo "::error::is-container template did not detect the container"; exit 1; }
          # Unlike the host-packages skip, this script's container branch
          # writes a message to stderr before exiting 0 — assert that message,
          # not silence.
          out="$(bash /tmp/devpod-configure.sh </dev/null 2>&1)"; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::script exited $rc inside a container, expected 0"
            printf '%s\n' "$out"
            exit 1
          fi
          case "$out" in
          *"skipping DevPod configuration"*) ;;
          *)
            echo "::error::script did not print the expected container-skip message:"
            printf '%s\n' "$out"
            exit 1
            ;;
          esac
          echo "configure-devpod script correctly skipped, with a message"
